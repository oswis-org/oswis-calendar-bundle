OswisOrg\OswisCalendarBundle\Entity\Participant\Participant:
  attributes:
    id:
      # `calendar_reservations_get`: bez id se rezervace nedá spárovat s frontou check-inu →
      # ubytovací stůl by nevěděl, KDO už v pokoji je (spolubydlící, kluci/holky zvlášť).
      groups: [ 'calendar_check_in_queue', 'calendar_reservations_get' ]
    deletedAt:
      groups: [ 'calendar_check_in_queue' ]
    participantCategory:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    notes:
      groups: [ 'calendar_participants_get', 'calendar_participants_post', 'calendar_participant_get', 'calendar_participant_put' ]
    arrivedAt:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    departedAt:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    # Partial-stay i do fronty: „pozdější příjezd / dřívější odjezd" musí být vidět na ŘÁDKU, ne až
    # po rozkliknutí — obsluha podle toho u stolu jedná (dnes to tým drží v Excelu mimo systém).
    plannedArrival:
      groups: [ 'calendar_participants_get', 'calendar_participants_post', 'calendar_participant_get', 'calendar_participant_put', 'calendar_check_in_queue' ]
    plannedDeparture:
      groups: [ 'calendar_participants_get', 'calendar_participants_post', 'calendar_participant_get', 'calendar_participant_put', 'calendar_check_in_queue' ]
    stationVisits:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    # `offer` (turnus) se přes generický PUT NEmění — je to virtuální relace s doménovou logikou,
    # kterou API Platform 4 neumí resolvovat z {id}/IRI (vyrobí prázdnou nabídku → 409). Změna
    # turnusu jde přes dedikovaný POST /participants/{id}/offer (ParticipantOfferApiController).
    # `calendar_participant_put` proto z grup vyjmuto, aby PUT nemohl vyrobit prázdnou nabídku.
    offer:
      groups: [ 'calendar_participants_get', 'calendar_participants_post', 'calendar_participant_get' ]
    contact:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_staff_teams_get', 'calendar_staff_team_get', 'calendar_event_staff_assignments_get', 'calendar_event_staff_assignment_get', 'calendar_check_in_queue' ]
    event:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    group:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    flagGroups:
      groups: [ 'calendar_participants_get', 'calendar_participants_post', 'calendar_participant_get', 'calendar_participant_put' ]
    priceRest:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    priceDeposit:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    price:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    remainingPrice:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    paidPrice:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    activatedContactUser:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]
    variableSymbol:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    sortableName:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    payments:
      groups: [ 'calendar_participants_get', 'calendar_participant_get' ]

OswisOrg\OswisCalendarBundle\Entity\Participant\ParticipantGroup:
  attributes:
    id:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    name:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    color:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]
    # Pořadí na jídlo patří i do fronty: stůl s páskami podle něj pozná, kdo jde první —
    # a DIETÁŘI JDOU VŽDY V PRVNÍ SKUPINĚ (mealOrder=1). Bez toho by to obsluha musela hádat.
    mealOrder:
      groups: [ 'calendar_participants_get', 'calendar_participant_get', 'calendar_check_in_queue' ]


