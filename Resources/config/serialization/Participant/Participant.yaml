      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_staff_teams_get'
        - 'calendar_staff_team_get'
        - 'calendar_event_staff_assignments_get'
        - 'calendar_event_staff_assignment_get'
        - 'calendar_check_in_queue'
    contactName:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
    details:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
    sortableName:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    phone:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    url:
      groups:
        - 'calendar_participant_get'
    email:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        # U účastníka bez jména (pozůstatek ztráty jména z registrace) je e-mail jediná
        # identifikace, kterou obsluha u stolu pozná — fronta ho proto musí nést.
        - 'calendar_check_in_queue'
    gender:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        # Ubytovací stůl: „kluky zvlášť a holky zvlášť, pokud účastníci nechtějí jinak" (user 17.7.).
        # POZOR — je to NÁPOVĚDA, ne pravda: `Person::getGender()` ho odvozuje ze jména přes vokativ,
        # který neznámá/cizí jména defaultně považuje za MUŽSKÁ, a přihláška bez jména vrátí `unisex`.
        # Proto smí řídit jen ŘAZENÍ nabídky, nikdy zákaz. Ruční oprava = `genderOverride` na kontaktu.
        - 'calendar_check_in_queue'
    oneImage:
      groups:
        - 'calendar_participants_get'
        - 'calendar_participant_get'


