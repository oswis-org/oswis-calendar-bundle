OswisOrg\OswisCalendarBundle\Entity\Participant\ParticipantGroup:
  attributes:
    id:
      groups:
        - 'calendar_participant_groups_get'
        - 'calendar_participant_group_get'
        # Nástěnka ukazuje u cíleného vzkazu štítek „pro <páska>". Bez těchto tří grup by se
        # vnořená skupina serializovala naprázdno — vzkaz čte grupy nástěnky, ne ty obecné.
        - 'calendar_announcements_get'
        - 'calendar_announcement_get'
        # Totéž platí pro přihlášku: `Participant.group` sice v get-grupách je, ale dokud tady
        # nebyly grupy PŘIHLÁŠKY, serializoval se pásek jako holé `@id` bez jediného pole —
        # appka pak nemohla ani zobrazit název, ani předvyplnit aktuální pásek ve výběru.
        # (Táž past jako u rozbité obnovy hesla: grupy jsou v YAMLech, ne v atributech entit.)
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    name:
      groups:
        - 'calendar_announcements_get'
        - 'calendar_announcement_get'
        - 'calendar_participant_groups_get'
        - 'calendar_participant_group_get'
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    color:
      groups:
        - 'calendar_participant_groups_get'
        - 'calendar_participant_group_get'
        - 'calendar_participant_groups_post'
        - 'calendar_participant_group_put'
        - 'calendar_announcements_get'
        - 'calendar_announcement_get'
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    mealOrder:
      groups:
        - 'calendar_participant_groups_get'
        - 'calendar_participant_group_get'
        - 'calendar_participant_groups_post'
        - 'calendar_participant_group_put'
        - 'calendar_participants_get'
        - 'calendar_participant_get'
        - 'calendar_check_in_queue'
    event:
      groups:
        - 'calendar_participant_groups_get'
        - 'calendar_participant_group_get'
        - 'calendar_participant_groups_post'
        - 'calendar_participant_group_put'
